# Cucumber on JUnit 5. Anything here can be overridden on the command line with -D<key>=<value>
cucumber.publish.quiet=true
cucumber.junit-platform.naming-strategy=long

# Reports (json feeds the masterthought report, xml feeds Jenkins' junit step, rerun lists failures)
cucumber.plugin=summary, \
  json:target/cucumber-reports/cucumber.json, \
  html:target/cucumber-reports/cucumber.html, \
  junit:target/cucumber-reports/cucumber.xml, \
  rerun:target/rerun.txt

# Parallel scenarios: each scenario runs on its own thread with its own browser.
# Change the thread count with -Dcucumber.execution.parallel.config.fixed.parallelism=N
# (set max-pool-size to the same N).
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.config.fixed.max-pool-size=3

# Tag filter: pass on the command line, e.g. -Dcucumber.filter.tags="@smoke"
